[package]
name = "mire-streaming"
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
thiserror = "1.0.69"
indicatif = "0.17.11"
bytes = "1.10.1"
rayon = "1.10.0"
crossbeam-channel = "0.5.15"
memchr = "2.7.4"
flate2 = { version = "1.1.2", features = ["zlib-rs"] }
libdeflater = "1.25.2"
isal-rs = { version = "0.5.3", optional = true }

[features]
isal = ["dep:isal-rs"]
